name: Deploy Laravel Backend

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            if [ ! -d /var/www/bin_huwesh_repo ]; then
                git clone git@github.com:OmarBinzager/Bin_Huwesh_store.git /var/www/bin_huwesh_repo
            else
                cd /var/www/bin_huwesh_repo && git pull origin main
            fi

            rsync -av --exclude='.env' --exclude='storage' --exclude='vendor' /var/www/bin_huwesh_repo/dashboard/ /var/www/store-dashboard/
            cd /var/www/store-dashboard
            php artisan config:clear
            php artisan cache:clear
            systemctl reload php8.3-fpm
            systemctl reload nginx
            echo "Deployment successful!"
